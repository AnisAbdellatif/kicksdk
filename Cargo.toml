[workspace]
resolver = "3"
members = ["crates/kicksdk", "crates/kicksdk-wasm", "bindings/elixir/native/kicksdk_nif"]
default-members = ["crates/kicksdk", "crates/kicksdk-wasm", "bindings/elixir/native/kicksdk_nif"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnisAbdellatif/kicksdk"
authors = ["Anis Abdellatif"]

[workspace.dependencies]
kicksdk = { path = "crates/kicksdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
