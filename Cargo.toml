[workspace]
resolver = "3"
members = ["crates/kicksdk", "crates/kicksdk-wasm", "crates/kicksdk-nif", "crates/kicksdk-ffi", "bindings/python"]
default-members = ["crates/kicksdk", "crates/kicksdk-ffi", "crates/kicksdk-nif"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnisAbdellatif/kicksdk"
authors = ["Anis Abdellatif"]

[workspace.dependencies]
kicksdk = { path = "crates/kicksdk", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
# No preserve_order here: it would be forced on every user of the core.
# kicksdk's `dispatch` feature and the WebAssembly crate turn it on.
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
# Drops the symbol table and debug info from what ships. The exports stay:
# they are the dynamic symbol table (nif_init, kicksdk_*, PyInit__native).
strip = "symbols"
