# Releases every package from one tag: git tag v0.2.0 && git push origin v0.2.0
#
# 1. plan (scripts/release-plan.sh) checks the tag and the versions, and
#    decides which jobs run.
# 2. build.yml builds, read-only, as artifacts of this run: the Elixir NIFs
#    (rustler_precompiled's naming), the Dart/C library per target
#    (kicksdk_ffi-v<version>-<triple>.<so|dylib|dll>), the Python wheels and
#    the npm package; and checks the vendored source fallback.
# 3. The GitHub release is created, and the NIFs and the FFI libraries are
#    uploaded to it, never replacing a file it has
#    (scripts/upload-release-assets.sh). The wheels and the npm package go to
#    their registries only.
# 4. Each package is published once what it needs is ready: hex and pub only
#    after every one of their binaries is on the release. They record those
#    files' checksums, and ship a vendored Cargo workspace
#    (scripts/vendor-native.sh) to build from when no binary fits.
#
# Publishing needs, per registry (docs/releasing.md):
#   crates.io  CARGO_REGISTRY_TOKEN secret, or trusted publishing
#   PyPI       a trusted publisher
#   npm        NPM_TOKEN secret, or trusted publishing
#   hex        HEX_API_KEY secret
#   pub.dev    automated publishing, which takes tag pushes only
# A registry that is not set up fails its own job and leaves the others alone.
# A version a registry already has is skipped, so a re-run does what is left.

name: Release

on:
  push:
    tags: ["v*"]
  # Started on a tag ("Use workflow from" the tag, or gh workflow run
  # release.yml --ref v0.2.0), it re-runs part of that release with the tag's
  # own workflow and scripts. Started on a branch, it is a dry run.
  # docs/releasing.md has when to use which.
  workflow_dispatch:
    inputs:
      only:
        description: Jobs to run, comma separated (release, nif, ffi, wheels, crates, pypi, npm, hex, pub); empty for all
        required: false
        default: ""
      dry_run:
        description: Build and check everything; upload and publish nothing (always so on a branch)
        type: boolean
        default: false

permissions: {}

# One run per tag at a time: a second one waits rather than racing the first
# to the release and the registries.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      release: ${{ steps.plan.outputs.release }}
      nif: ${{ steps.plan.outputs.nif }}
      ffi: ${{ steps.plan.outputs.ffi }}
      wheels: ${{ steps.plan.outputs.wheels }}
      js: ${{ steps.plan.outputs.js }}
      vendored: ${{ steps.plan.outputs.vendored }}
      packages: ${{ steps.plan.outputs.packages }}
      crates: ${{ steps.plan.outputs.crates }}
      pypi: ${{ steps.plan.outputs.pypi }}
      npm: ${{ steps.plan.outputs.npm }}
      hex: ${{ steps.plan.outputs.hex }}
      pub: ${{ steps.plan.outputs.pub }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: scripts/release-plan.sh && cat "$GITHUB_OUTPUT"

  # ---- Builds (read-only) -------------------------------------------------------

  build-nif:
    name: Build NIFs
    needs: plan
    if: needs.plan.outputs.nif == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      part: nif

  build-ffi:
    name: Build FFI libraries
    needs: plan
    if: needs.plan.outputs.ffi == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      part: ffi

  build-wheels:
    name: Build wheels
    needs: plan
    if: needs.plan.outputs.wheels == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      part: wheels

  build-js:
    name: Build the npm package
    needs: plan
    if: needs.plan.outputs.js == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      part: js

  vendored:
    name: Vendored sources
    needs: plan
    if: needs.plan.outputs.vendored == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      part: vendored

  # Dry runs only: the packages as they would be published, from this run's
  # binaries.
  packages:
    name: Packages (dry run)
    needs: [plan, build-nif, build-ffi]
    if: needs.plan.outputs.packages == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      part: packages

  # ---- The GitHub release ---------------------------------------------------------

  release:
    name: Create the GitHub release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  upload-nif:
    name: Upload the NIFs
    needs: [plan, release, build-nif]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.nif == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nif-tarballs
          path: dist
      - env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/upload-release-assets.sh "$TAG" dist/*

  upload-ffi:
    name: Upload the FFI libraries
    needs: [plan, release, build-ffi]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.ffi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffi-*
          merge-multiple: true
          path: dist
      - env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/upload-release-assets.sh "$TAG" dist/*

  # ---- Publishing -------------------------------------------------------------------

  crates:
    name: Publish to crates.io
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      # Secrets cannot appear in `if:`; this says whether there is one.
      - id: token
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.token.outputs.has != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # crates.io never takes a version twice: a crate that has this one is
      # skipped, so a re-run publishes what is left (kicksdk-ffi after kicksdk).
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          for crate in kicksdk kicksdk-ffi; do
            code=$(curl -sS -o "$RUNNER_TEMP/index" -w '%{http_code}' "https://index.crates.io/ki/ck/$crate")
            if [ "$code" = 200 ] && grep -qF "\"vers\":\"$VERSION\"" "$RUNNER_TEMP/index"; then
              echo "$crate $VERSION is on crates.io already"
            elif [ "$code" = 200 ] || [ "$code" = 404 ]; then
              cargo publish --locked -p "$crate"
            else
              echo "::error::the crates.io index answered $code for $crate"
              exit 1
            fi
          done

  pypi:
    name: Publish to PyPI
    needs: [plan, build-wheels]
    if: needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run after another registry failed must not fail here.
          skip-existing: true

  npm:
    name: Publish to npm
    needs: [plan, build-js]
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-package
          path: dist
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: published
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if npm view "kicksdk-js@$VERSION" version >/dev/null 2>&1; then
            echo "kicksdk-js $VERSION is on npm already"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      # The tarball build.yml packed and tested. With the NPM_TOKEN secret, a
      # token publish; without it, npm's trusted publishing through this
      # job's OIDC token (npm 11.5+, Node 24's). Provenance either way.
      - if: steps.published.outputs.yes != 'true'
        run: npm publish dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  hex:
    name: Publish to hex
    needs: [plan, release, build-nif, upload-nif, vendored]
    # Waits for every NIF to be on the release. On a re-run with only "hex"
    # the NIF jobs are skipped: the release has its NIFs already.
    if: always() && needs.plan.outputs.hex == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: hex
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bindings/elixir
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      # hex lets a new version be replaced for a while after it is published;
      # a re-run must not do that.
      - id: published
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/kicksdk/releases/$VERSION")
          case "$code" in
            200) echo "kicksdk $VERSION is on hex already"; echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            404) ;;
            *) echo "::error::hex.pm answered $code"; exit 1 ;;
          esac
      - run: ../../scripts/vendor-native.sh bindings/elixir kicksdk-nif
      - run: ../../scripts/package-files.sh bindings/elixir
      - run: mix deps.get
      # Writes checksum-Elixir.Kicksdk.Native.exs from the release's own NIFs,
      # every target's (--all fails on a missing one).
      - run: |
          KICKSDK_BUILD=1 mix compile
          mix rustler_precompiled.download Kicksdk.Native --all --print
      # The package as its users get it: the NIF downloaded from the release,
      # checked against those checksums, loaded and tested.
      - name: The precompiled NIF loads (no Rust on PATH)
        env:
          MIX_ENV: test
        run: ../../scripts/without-rust.sh mix test
      # The source fallback, from the package as hex will serve it.
      - name: The hex package, built from source
        if: steps.published.outputs.yes != 'true'
        run: ../../scripts/check-hex-package.sh
      - if: steps.published.outputs.yes != 'true'
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  pub:
    name: Publish to pub.dev
    needs: [plan, release, build-ffi, upload-ffi, vendored]
    # Waits for every library to be on the release; see hex. pub.dev takes
    # this job's token from tag pushes only (plan leaves pub out otherwise).
    if: always() && needs.plan.outputs.pub == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: pub-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings/dart
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - id: published
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/kicksdk/versions/$VERSION")
          case "$code" in
            200) echo "kicksdk $VERSION is on pub.dev already"; echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            404) ;;
            *) echo "::error::pub.dev answered $code"; exit 1 ;;
          esac
      # Every library the hook can download, as the release serves it.
      - name: Checksums of the release's own libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'kicksdk_ffi-*' --dir "$RUNNER_TEMP/ffi"
          ../../scripts/dart-checksums.sh "$VERSION" "$RUNNER_TEMP/ffi"
      # The package as its users get it: the library downloaded from the
      # release, checked against checksums.json, loaded and tested.
      - name: The precompiled download (no Rust on PATH)
        run: dart pub get && ../../scripts/without-rust.sh dart test
      - run: ../../scripts/vendor-native.sh bindings/dart kicksdk-ffi
      - run: ../../scripts/package-files.sh bindings/dart
      # The source fallback, from the archive pub.dev will serve: pub leaves
      # out files the checkout has, so the checkout building proves nothing.
      - name: The pub archive, built from source
        if: steps.published.outputs.yes != 'true'
        run: |
          dart pub publish --to-archive="$RUNNER_TEMP/kicksdk.tar.gz"
          ../../scripts/check-dart-archive.sh "$RUNNER_TEMP/kicksdk.tar.gz"
      - if: steps.published.outputs.yes != 'true'
        run: dart pub publish --force
