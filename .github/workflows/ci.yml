name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --no-deps -p kicksdk
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace
      # The minimum supported Rust version, for the core alone.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.88"
      - run: cargo +1.88 build -p kicksdk --all-features

  js:
    name: npm package (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # wasm-bindgen-cli at the version Cargo.lock pins, and a checked binaryen.
      - run: scripts/install-wasm-tools.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: scripts/build-js.sh
      - run: npm test
        working-directory: bindings/js
      # The package's types, from a strict TypeScript consumer.
      - run: npx --yes -p typescript@5.9.3 tsc -p test/types/tsconfig.json
        working-directory: bindings/js

  consistency:
    name: One version, every function in every language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: scripts/release-check.sh
      # The FFI build matrix builds exactly what the Dart hook can download.
      - run: scripts/ffi-targets.sh --check
      # Fails when a core function has no binding in some language.
      - run: python3 scripts/docs/api_table.py --check

  lint:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: bash -n scripts/*.sh && shellcheck scripts/*.sh
      - name: actionlint 1.7.12, checked against its SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  python:
    name: Python package (PyO3, ${{ matrix.python }})
    runs-on: ubuntu-latest
    # The oldest Python and dependency versions the package allows, and the
    # current ones: the wheel is abi3, and aio supports websockets 13+ and
    # httpx 0.27+.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            deps: websockets==13.0 httpx==0.27.0
          - python: "3.14"
            deps: websockets httpx
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          read -ra deps <<< "$DEPS"
          uv venv -p "$PYTHON" && uv pip install maturin pytest mypy "${deps[@]}"
        env:
          PYTHON: ${{ matrix.python }}
          DEPS: ${{ matrix.deps }}
      - run: .venv/bin/maturin develop --uv
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python -m mypy.stubtest kicksdk._native
      - run: .venv/bin/python -m mypy --strict python/kicksdk/aio.py python/kicksdk/webhooks.py tests ../../examples/python/chat.py

  dart:
    name: Dart package (FFI, built from source)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 .
      - run: dart analyze --fatal-infos
      # No hook/checksums.json in a checkout: the build hook compiles the
      # library with cargo, the fallback every package has.
      - run: dart test

  elixir:
    name: hex package (NIF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/elixir
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # The hex and pub packages' source fallback: their vendored native/
  # workspaces build offline, and each package builds itself from one.
  vendored:
    name: Vendored sources
    uses: ./.github/workflows/build.yml
    with:
      part: vendored
