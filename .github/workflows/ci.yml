name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --no-deps -p kicksdk
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace
      # The minimum supported Rust version, for the core alone.
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo +1.88 build -p kicksdk --all-features

  js:
    name: npm package (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-cli at the version Cargo.lock pins, and a checked binaryen.
      - run: scripts/install-wasm-tools.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: scripts/build-js.sh
      - run: npm test
        working-directory: bindings/js

  consistency:
    name: One version, every function in every language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/release-check.sh
      # Fails when a core function has no binding in some language.
      - run: python3 scripts/docs/api_table.py --check

  python:
    name: Python package (PyO3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install maturin pytest httpx websockets
      - run: .venv/bin/maturin develop --uv
      - run: .venv/bin/pytest -q

  dart:
    name: Dart package (FFI, built from source)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 .
      - run: dart analyze --fatal-infos
      # No hook/checksums.json in a checkout: the build hook compiles the
      # library with cargo, the fallback every package has.
      - run: dart test

  elixir:
    name: hex package (NIF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/elixir
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
