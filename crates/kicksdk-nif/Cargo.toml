[package]
name = "kicksdk_nif"
description = "kicksdk for Elixir, as a NIF"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "kicksdk_nif"
crate-type = ["cdylib"]

[dependencies]
kicksdk = { workspace = true, features = ["dispatch"] }
serde.workspace = true
serde_json.workspace = true
rustler = { version = "0.38", default-features = false, features = ["nif_version_2_15"] }
